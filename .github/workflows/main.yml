name: Build SIYOMA Apps Hub Website

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build SIYOMA Apps Hub Website
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website source
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " SIYOMA APPS HUB WEBSITE"
          echo "=========================================="

          rm -rf website-source
          mkdir -p website-source

          # If the website is already extracted, use it.
          if [ -f "index.html" ]; then
            echo "Website files found in repository root."
            cp -R . website-source/ 2>/dev/null || true

          else
            echo "Website files not found in repository root."
            echo "Searching for website ZIP..."

            ZIP_FILE=""

            for file in ./*.zip; do
              if [ -f "$file" ]; then
                ZIP_FILE="$file"
                break
              fi
            done

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No ZIP file found."
              echo ""
              echo "Repository contents:"
              find . -maxdepth 4 -type f \
                ! -path './.git/*' \
                | sort
              exit 1
            fi

            echo "Using ZIP:"
            echo "$ZIP_FILE"

            unzip -q "$ZIP_FILE" -d website-source

            echo ""
            echo "ZIP extraction completed."
          fi

          echo ""
          echo "Searching extracted files..."

          INDEX_FILE=$(find website-source \
            -type f \
            -iname "index.html" \
            -print -quit)

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html was not found."
            echo ""
            echo "Files found after extraction:"
            find website-source -maxdepth 6 -type f | sort
            exit 1
          fi

          WEBSITE_DIR="$(dirname "$INDEX_FILE")"

          echo ""
          echo "Website root found:"
          echo "$WEBSITE_DIR"

          echo "WEBSITE_DIR=$WEBSITE_DIR" >> "$GITHUB_ENV"

      - name: Show website files
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " WEBSITE FILES"
          echo "=========================================="

          find "$WEBSITE_DIR" -maxdepth 3 -type f | sort

      - name: Verify required website files
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking required website files..."

          REQUIRED_FILES=(
            "index.html"
            "styles.css"
            "app.js"
            "netlify.toml"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$WEBSITE_DIR/$file" ]; then
              echo "ERROR: Missing required file: $file"
              exit 1
            fi
          done

          if [ ! -d "$WEBSITE_DIR/assets" ]; then
            echo "ERROR: Missing assets directory."
            exit 1
          fi

          echo "All required website files are present."

      - name: Verify website assets
        shell: bash
        run: |
          set -euo pipefail

          ASSET_COUNT=$(find "$WEBSITE_DIR/assets" -type f | wc -l)

          echo "Website asset count: $ASSET_COUNT"

          if [ "$ASSET_COUNT" -eq 0 ]; then
            echo "ERROR: Assets directory is empty."
            exit 1
          fi

          echo "Website assets verified."

      - name: Validate HTML
        shell: bash
        run: |
          set -euo pipefail

          HTML="$WEBSITE_DIR/index.html"

          grep -qi '<!DOCTYPE html>' "$HTML"
          grep -qi '<html' "$HTML"
          grep -qi '<head' "$HTML"
          grep -qi '<body' "$HTML"

          echo "HTML structure verified."

      - name: Verify SIYOMA Apps Hub branding
        shell: bash
        run: |
          set -euo pipefail

          HTML="$WEBSITE_DIR/index.html"

          grep -qi "SIYOMA APPS HUB" "$HTML"
          grep -qi "Siyomatechdesigns" "$HTML"

          echo "SIYOMA Apps Hub branding verified."

      - name: Verify SIYOMA applications
        shell: bash
        run: |
          set -euo pipefail

          HTML="$WEBSITE_DIR/index.html"

          grep -qi "Tenant" "$HTML"
          grep -qi "GroupWork" "$HTML"
          grep -qi "CU Library" "$HTML"
          grep -qi "Academic Assistant" "$HTML"

          echo "SIYOMA application catalogue verified."

      - name: Verify developer contact
        shell: bash
        run: |
          set -euo pipefail

          HTML="$WEBSITE_DIR/index.html"

          if ! grep -q "254713622247" "$HTML"; then
            echo "ERROR: Developer WhatsApp number not found."
            exit 1
          fi

          echo "Developer WhatsApp integration verified."

      - name: Verify Netlify configuration
        shell: bash
        run: |
          set -euo pipefail

          NETLIFY="$WEBSITE_DIR/netlify.toml"

          if ! grep -q "publish" "$NETLIFY"; then
            echo "ERROR: Netlify publish configuration not found."
            exit 1
          fi

          echo "Netlify configuration verified."

      - name: Check for obvious secrets
        shell: bash
        run: |
          set -euo pipefail

          if grep -RniE \
            --exclude='*.map' \
            'sk_live_|sk_test_|BEGIN PRIVATE KEY|PRIVATE_KEY=' \
            "$WEBSITE_DIR"; then

            echo "ERROR: Possible secret detected."
            exit 1
          fi

          echo "No obvious secrets detected."

      - name: Create production package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          cp "$WEBSITE_DIR/index.html" release/
          cp "$WEBSITE_DIR/styles.css" release/
          cp "$WEBSITE_DIR/app.js" release/
          cp "$WEBSITE_DIR/netlify.toml" release/
          cp -R "$WEBSITE_DIR/assets" release/

          if [ -f "$WEBSITE_DIR/README.md" ]; then
            cp "$WEBSITE_DIR/README.md" release/
          fi

          echo "Production package created."

      - name: Verify production package
        shell: bash
        run: |
          set -euo pipefail

          test -f release/index.html
          test -f release/styles.css
          test -f release/app.js
          test -f release/netlify.toml
          test -d release/assets

          echo "Production package verified."

      - name: Create SIYOMA Apps Hub ZIP
        shell: bash
        run: |
          set -euo pipefail

          cd release

          zip -qr ../SIYOMA-APPS-HUB-Website.zip .

          cd ..

          ls -lh SIYOMA-APPS-HUB-Website.zip

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail

          sha256sum SIYOMA-APPS-HUB-Website.zip \
            | tee SIYOMA-APPS-HUB-Website.zip.sha256

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: SIYOMA-APPS-HUB-Website
          path: |
            SIYOMA-APPS-HUB-Website.zip
            SIYOMA-APPS-HUB-Website.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: SIYOMA Apps Hub build successful
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo " SIYOMA APPS HUB BUILD SUCCESSFUL"
          echo "=========================================="
          echo ""
          echo "Package:"
          echo "SIYOMA-APPS-HUB-Website.zip"
          echo ""
          echo "SHA-256:"
          cat SIYOMA-APPS-HUB-Website.zip.sha256
