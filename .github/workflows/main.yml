name: Build SIYOMA Apps Hub Website

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Validate and Package SIYOMA Apps Hub
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate SIYOMA Apps Hub website
        shell: bash
        run: |
          set -euo pipefail

          echo "Locating SIYOMA Apps Hub website..."

          if [ -f "index.html" ]; then
            WEBSITE_DIR="."
          else
            WEBSITE_DIR=""

            while IFS= read -r file; do
              candidate="$(dirname "$file")"

              if [ -f "$candidate/index.html" ] &&
                 [ -f "$candidate/styles.css" ] &&
                 [ -f "$candidate/app.js" ] &&
                 [ -f "$candidate/netlify.toml" ]; then
                WEBSITE_DIR="$candidate"
                break
              fi
            done < <(
              find . \
                -path './.git' -prune -o \
                -type f \
                -name 'index.html' \
                -print
            )
          fi

          if [ -z "$WEBSITE_DIR" ]; then
            echo "ERROR: SIYOMA Apps Hub website could not be located."
            echo ""
            echo "Required files:"
            echo "  index.html"
            echo "  styles.css"
            echo "  app.js"
            echo "  netlify.toml"
            echo ""
            echo "Repository contents:"
            find . -maxdepth 3 -type f \
              ! -path './.git/*' \
              | sort
            exit 1
          fi

          WEBSITE_DIR="$(realpath "$WEBSITE_DIR")"

          echo "Website located at:"
          echo "$WEBSITE_DIR"

          echo "WEBSITE_DIR=$WEBSITE_DIR" >> "$GITHUB_ENV"

      - name: Verify SIYOMA Apps Hub project files
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking SIYOMA Apps Hub files..."

          test -f "$WEBSITE_DIR/index.html"
          test -f "$WEBSITE_DIR/styles.css"
          test -f "$WEBSITE_DIR/app.js"
          test -f "$WEBSITE_DIR/netlify.toml"

          if [ ! -f "$WEBSITE_DIR/README.md" ]; then
            echo "WARNING: README.md not found."
            echo "Continuing because README.md is not required to run the website."
          fi

          if [ ! -d "$WEBSITE_DIR/assets" ]; then
            echo "ERROR: assets directory not found."
            exit 1
          fi

          echo "Core website files verified."

      - name: Verify website assets
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking website assets..."

          ASSET_COUNT=$(find "$WEBSITE_DIR/assets" -type f | wc -l)

          if [ "$ASSET_COUNT" -lt 1 ]; then
            echo "ERROR: No website assets found."
            exit 1
          fi

          echo "Found $ASSET_COUNT asset file(s)."

      - name: Validate HTML
        shell: bash
        run: |
          set -euo pipefail

          cd "$WEBSITE_DIR"

          grep -qi '<!DOCTYPE html>' index.html
          grep -qi '<html' index.html
          grep -qi '<head' index.html
          grep -qi '<body' index.html

          echo "HTML structure verified."

      - name: Verify SIYOMA Apps Hub branding
        shell: bash
        run: |
          set -euo pipefail

          cd "$WEBSITE_DIR"

          echo "Checking SIYOMA Apps Hub branding..."

          grep -qi "SIYOMA APPS HUB" index.html
          grep -qi "Siyomatechdesigns" index.html

          echo "SIYOMA Apps Hub branding verified."

      - name: Verify SIYOMA applications
        shell: bash
        run: |
          set -euo pipefail

          cd "$WEBSITE_DIR"

          echo "Checking listed SIYOMA applications..."

          grep -qi "Tenant" index.html
          grep -qi "GroupWork" index.html
          grep -qi "CU Library" index.html
          grep -qi "Academic Assistant" index.html

          echo "SIYOMA application catalogue verified."

      - name: Verify Under Review status
        shell: bash
        run: |
          set -euo pipefail

          cd "$WEBSITE_DIR"

          grep -qi "Under Review" index.html

          echo "Under Review applications verified."

      - name: Verify developer WhatsApp integration
        shell: bash
        run: |
          set -euo pipefail

          cd "$WEBSITE_DIR"

          if ! grep -q "254713622247" index.html; then
            echo "ERROR: SIYOMA Tech Designs WhatsApp contact link not found."
            exit 1
          fi

          echo "Developer WhatsApp integration verified."

      - name: Verify Netlify configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$WEBSITE_DIR"

          if ! grep -q "publish" netlify.toml; then
            echo "ERROR: Netlify publish configuration not found."
            exit 1
          fi

          echo "Netlify configuration verified."

      - name: Check for accidentally committed secrets
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking for obvious secrets..."

          if grep -RniE \
            --exclude-dir=.git \
            --exclude='*.map' \
            'sk_live_|sk_test_|secret_key|private_key|BEGIN PRIVATE KEY' \
            "$WEBSITE_DIR"; then
            echo "ERROR: Possible secret detected in website files."
            exit 1
          fi

          echo "No obvious secrets detected."

      - name: Check local website references
        shell: bash
        run: |
          set -euo pipefail

          cd "$WEBSITE_DIR"

          python3 <<'PY'
          import re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")

          references = set()

          for match in re.findall(r'(?:src|href)=["\']([^"\']+)["\']', html):
              if match.startswith((
                  "http://",
                  "https://",
                  "#",
                  "mailto:",
                  "tel:",
                  "data:",
                  "javascript:"
              )):
                  continue

              clean = match.split("#")[0].split("?")[0]

              if clean:
                  references.add(clean)

          missing = []

          for ref in sorted(references):
              path = Path(ref)

              if not path.exists():
                  missing.append(ref)

          if missing:
              print("ERROR: Missing referenced local files:")

              for item in missing:
                  print(f" - {item}")

              raise SystemExit(1)

          print("All local website references are valid.")
          PY

      - name: Create production website package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          cp "$WEBSITE_DIR/index.html" release/
          cp "$WEBSITE_DIR/styles.css" release/
          cp "$WEBSITE_DIR/app.js" release/
          cp "$WEBSITE_DIR/netlify.toml" release/

          if [ -f "$WEBSITE_DIR/README.md" ]; then
            cp "$WEBSITE_DIR/README.md" release/
          fi

          cp -R "$WEBSITE_DIR/assets" release/

          echo "Production website package created."

      - name: Verify production package
        shell: bash
        run: |
          set -euo pipefail

          test -f release/index.html
          test -f release/styles.css
          test -f release/app.js
          test -f release/netlify.toml
          test -d release/assets

          echo "Production package verified."

      - name: Create SIYOMA Apps Hub ZIP
        shell: bash
        run: |
          set -euo pipefail

          cd release

          zip -qr \
            ../SIYOMA-APPS-HUB-Website.zip \
            .

          cd ..

          ls -lh SIYOMA-APPS-HUB-Website.zip

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail

          sha256sum SIYOMA-APPS-HUB-Website.zip \
            | tee SIYOMA-APPS-HUB-Website.zip.sha256

      - name: Upload SIYOMA Apps Hub website package
        uses: actions/upload-artifact@v4
        with:
          name: SIYOMA-APPS-HUB-Website
          path: |
            SIYOMA-APPS-HUB-Website.zip
            SIYOMA-APPS-HUB-Website.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Build completed successfully
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo " SIYOMA APPS HUB BUILD SUCCESSFUL"
          echo "=========================================="
          echo ""
          echo "Website package:"
          echo "SIYOMA-APPS-HUB-Website.zip"
          echo ""
          echo "SHA-256:"
          cat SIYOMA-APPS-HUB-Website.zip.sha256
          echo ""
          echo "Ready for Netlify deployment."
