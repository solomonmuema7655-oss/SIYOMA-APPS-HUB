name: Build SIYOMA Apps Hub Website

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Validate and Package SIYOMA Apps Hub
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate website source
        shell: bash
        run: |
          set -euo pipefail

          echo "Locating SIYOMA Apps Hub website..."

          if [ -f "index.html" ]; then
            WEBSITE_DIR="."
            echo "Website files already exist in repository root."

          else
            ZIP_FILE=$(find . -maxdepth 2 -type f \
              -iname '*.zip' \
              -print -quit)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No website ZIP file found."
              exit 1
            fi

            echo "Website ZIP found:"
            echo "$ZIP_FILE"

            rm -rf extracted-site
            mkdir -p extracted-site

            unzip -q "$ZIP_FILE" -d extracted-site

            echo "ZIP extracted."

            if [ -f "extracted-site/index.html" ]; then
              WEBSITE_DIR="$GITHUB_WORKSPACE/extracted-site"

            else
              WEBSITE_DIR=$(find "$GITHUB_WORKSPACE/extracted-site" \
                -type f \
                -name "index.html" \
                -print -quit |
                xargs -r dirname)

              if [ -z "$WEBSITE_DIR" ]; then
                echo "ERROR: index.html was not found after extracting ZIP."
                echo ""
                echo "Extracted contents:"
                find extracted-site -maxdepth 4 -type f | sort
                exit 1
              fi
            fi
          fi

          echo "Website directory:"
          echo "$WEBSITE_DIR"

          echo "WEBSITE_DIR=$WEBSITE_DIR" >> "$GITHUB_ENV"

      - name: Verify SIYOMA Apps Hub project files
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking SIYOMA Apps Hub files..."

          test -f "$WEBSITE_DIR/index.html"
          test -f "$WEBSITE_DIR/styles.css"
          test -f "$WEBSITE_DIR/app.js"
          test -f "$WEBSITE_DIR/netlify.toml"

          if [ ! -f "$WEBSITE_DIR/README.md" ]; then
            echo "WARNING: README.md not found."
          fi

          if [ ! -d "$WEBSITE_DIR/assets" ]; then
            echo "ERROR: assets directory not found."
            exit 1
          fi

          echo "Core website files verified."

      - name: Verify website assets
        shell: bash
        run: |
          set -euo pipefail

          ASSET_COUNT=$(find "$WEBSITE_DIR/assets" -type f | wc -l)

          if [ "$ASSET_COUNT" -lt 1 ]; then
            echo "ERROR: No website assets found."
            exit 1
          fi

          echo "Found $ASSET_COUNT asset file(s)."

      - name: Validate HTML
        shell: bash
        run: |
          set -euo pipefail

          grep -qi '<!DOCTYPE html>' "$WEBSITE_DIR/index.html"
          grep -qi '<html' "$WEBSITE_DIR/index.html"
          grep -qi '<head' "$WEBSITE_DIR/index.html"
          grep -qi '<body' "$WEBSITE_DIR/index.html"

          echo "HTML structure verified."

      - name: Verify SIYOMA Apps Hub branding
        shell: bash
        run: |
          set -euo pipefail

          grep -qi "SIYOMA APPS HUB" "$WEBSITE_DIR/index.html"
          grep -qi "Siyomatechdesigns" "$WEBSITE_DIR/index.html"

          echo "SIYOMA Apps Hub branding verified."

      - name: Verify SIYOMA applications
        shell: bash
        run: |
          set -euo pipefail

          grep -qi "Tenant" "$WEBSITE_DIR/index.html"
          grep -qi "GroupWork" "$WEBSITE_DIR/index.html"
          grep -qi "CU Library" "$WEBSITE_DIR/index.html"
          grep -qi "Academic Assistant" "$WEBSITE_DIR/index.html"

          echo "SIYOMA application catalogue verified."

      - name: Verify Under Review status
        shell: bash
        run: |
          set -euo pipefail

          grep -qi "Under Review" "$WEBSITE_DIR/index.html"

          echo "Under Review applications verified."

      - name: Verify developer WhatsApp integration
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q "254713622247" "$WEBSITE_DIR/index.html"; then
            echo "ERROR: Developer WhatsApp contact link not found."
            exit 1
          fi

          echo "Developer WhatsApp integration verified."

      - name: Verify Netlify configuration
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q "publish" "$WEBSITE_DIR/netlify.toml"; then
            echo "ERROR: Netlify publish configuration not found."
            exit 1
          fi

          echo "Netlify configuration verified."

      - name: Check for accidentally committed secrets
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking for obvious secrets..."

          if grep -RniE \
            --exclude='*.map' \
            'sk_live_|sk_test_|secret_key|private_key|BEGIN PRIVATE KEY' \
            "$WEBSITE_DIR"; then

            echo "ERROR: Possible secret detected."
            exit 1
          fi

          echo "No obvious secrets detected."

      - name: Check local website references
        shell: bash
        run: |
          set -euo pipefail

          cd "$WEBSITE_DIR"

          python3 <<'PY'
          import re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")

          references = set()

          for match in re.findall(r'(?:src|href)=["\']([^"\']+)["\']', html):

              if match.startswith((
                  "http://",
                  "https://",
                  "#",
                  "mailto:",
                  "tel:",
                  "data:",
                  "javascript:"
              )):
                  continue

              clean = match.split("#")[0].split("?")[0]

              if clean:
                  references.add(clean)

          missing = []

          for ref in sorted(references):
              if not Path(ref).exists():
                  missing.append(ref)

          if missing:
              print("ERROR: Missing referenced local files:")

              for item in missing:
                  print(f" - {item}")

              raise SystemExit(1)

          print("All local website references are valid.")
          PY

      - name: Create production website package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          cp "$WEBSITE_DIR/index.html" release/
          cp "$WEBSITE_DIR/styles.css" release/
          cp "$WEBSITE_DIR/app.js" release/
          cp "$WEBSITE_DIR/netlify.toml" release/

          if [ -f "$WEBSITE_DIR/README.md" ]; then
            cp "$WEBSITE_DIR/README.md" release/
          fi

          cp -R "$WEBSITE_DIR/assets" release/

          echo "Production website package created."

      - name: Verify production package
        shell: bash
        run: |
          set -euo pipefail

          test -f release/index.html
          test -f release/styles.css
          test -f release/app.js
          test -f release/netlify.toml
          test -d release/assets

          echo "Production package verified."

      - name: Create SIYOMA Apps Hub ZIP
        shell: bash
        run: |
          set -euo pipefail

          cd release

          zip -qr \
            ../SIYOMA-APPS-HUB-Website.zip \
            .

          cd ..

          ls -lh SIYOMA-APPS-HUB-Website.zip

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail

          sha256sum SIYOMA-APPS-HUB-Website.zip \
            | tee SIYOMA-APPS-HUB-Website.zip.sha256

      - name: Upload SIYOMA Apps Hub website package
        uses: actions/upload-artifact@v4
        with:
          name: SIYOMA-APPS-HUB-Website
          path: |
            SIYOMA-APPS-HUB-Website.zip
            SIYOMA-APPS-HUB-Website.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Build completed successfully
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo " SIYOMA APPS HUB BUILD SUCCESSFUL"
          echo "=========================================="
          echo ""
          echo "Website package:"
          echo "SIYOMA-APPS-HUB-Website.zip"
          echo ""
          echo "SHA-256:"
          cat SIYOMA-APPS-HUB-Website.zip.sha256
          echo ""
          echo "Website package is ready for Netlify."
