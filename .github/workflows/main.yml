name: Build SIYOMA APPS HUB Website

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract website ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository contents:"
          find . -maxdepth 3 -type f -print

          mkdir -p website-source

          if [ -f "index.html" ]; then
            echo "Website files already exist in repository root."
            WEBSITE_DIR="."
          else
            ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1 || true)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No website ZIP file found."
              exit 1
            fi

            echo "Found ZIP: $ZIP_FILE"

            unzip -o "$ZIP_FILE" -d website-source

            echo "Extracted files:"
            find website-source -maxdepth 5 -type f -print

            INDEX_FILE=$(find website-source -type f -name "index.html" | head -n 1 || true)

            if [ -z "$INDEX_FILE" ]; then
              echo "ERROR: index.html was not found after extraction."
              exit 1
            fi

            WEBSITE_DIR=$(dirname "$INDEX_FILE")
          fi

          echo "Website directory: $WEBSITE_DIR"

          echo "WEBSITE_DIR=$WEBSITE_DIR" >> "$GITHUB_ENV"

      - name: Verify website files
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking website files in:"
          echo "$WEBSITE_DIR"

          test -f "$WEBSITE_DIR/index.html"
          test -f "$WEBSITE_DIR/styles.css"
          test -f "$WEBSITE_DIR/app.js"
          test -f "$WEBSITE_DIR/netlify.toml"

          echo "Required website files verified."

          if [ -d "$WEBSITE_DIR/assets" ]; then
            echo "Assets directory verified."
          else
            echo "WARNING: assets directory not found."
          fi

      - name: Validate HTML
        shell: bash
        run: |
          set -euo pipefail

          HTML="$WEBSITE_DIR/index.html"

          test -s "$HTML"

          echo "HTML file exists and is not empty."
          echo "HTML size:"
          wc -c "$HTML"

      - name: Check for obvious secrets
        shell: bash
        run: |
          set -euo pipefail

          if grep -RniE \
            --exclude-dir=.git \
            --exclude="*.zip" \
            -E "sk_live_|secret[_-]?key|private[_-]?key" \
            "$WEBSITE_DIR"; then

            echo "ERROR: Possible secret detected."
            exit 1
          fi

          echo "No obvious secrets detected."

      - name: Create release package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          cp -a "$WEBSITE_DIR"/. release/

          cd release

          zip -r "../SIYOMA-APPS-HUB-Website.zip" .

          cd ..

          sha256sum "SIYOMA-APPS-HUB-Website.zip"

          echo "Final website package created:"
          ls -lh "SIYOMA-APPS-HUB-Website.zip"

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: SIYOMA-APPS-HUB-Website
          path: SIYOMA-APPS-HUB-Website.zip
          if-no-files-found: error
